# ==========================================
# --- TEMA NOCTALIA (injetado dinamicamente) ---
# ==========================================
# O Noctalia gere as cores através de templates.
# Não editar as cores abaixo manualmente — elas são sobrescritas pelo Noctalia.

# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME

# --- FONTE ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Ajustes de renderização
adjust_line_height  0
adjust_column_width 0
disable_ligatures   cursor

# --- JANELA & VISUAL ---
# Opacidade igual à da Waybar e Hyprland
background_opacity 0.85

# Margem interna limpa
window_padding_width 10

# Sem bordas (deixa o Hyprland desenhar a borda Gelo)
hide_window_decorations yes
confirm_os_window_close 0

# --- CURSOR (Ajustado) ---
cursor_shape     beam
cursor_blink_interval 0.5

# --- MOUSE & URLS ---
detect_urls      yes
copy_on_select   yes

# --- TAB BAR (Opcional, se usar abas) ---
tab_bar_style       powerline
tab_powerline_style slanted