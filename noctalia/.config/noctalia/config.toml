[accessibility]
ui_scale = 1.0000000074505806

[bar.default]
capsule_group = []
center = [ "workspaces", "active_window", "spacer_1" ]
concave_edge_corners = true
end = [ "media", "spacer_1", "tray", "notifications", "network", "volume", "battery", "session" ]
margin_edge = 0
margin_ends = 0
padding = 8
radius = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
scale = 0.95000000670552254
start = [ "clock", "spacer_1" ]
thickness = 26

[battery]
warning_threshold = 20

    [battery.device."/org/freedesktop/UPower/devices/headset_dev_41_42_A9_A3_34_56"]
    warning_threshold = 0

[dock]
active_monitor_only = true
auto_hide = true
background_opacity = 0.99999997764825821
enabled = true
icon_size = 20
radius = 10
radius_bottom_left = 0
radius_bottom_right = 0
reserve_space = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend", "Hibernate" ]

    [idle.behavior.Hibernate]
    action = "command"
    command = "systemctl hibernate"
    enabled = true
    timeout = 1100.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 480.0
    cy = 358.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 538.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
force = true

[shell]
app_icon_color = "primary"
clipboard_image_action_command = "satty -f -"
corner_radius_scale = 0.30000000447034836
launch_apps_as_systemd_services = true
polkit_agent = true
popup_shadows = false
settings_show_advanced = true

    [shell.animation]
    enabled = false
    speed = 0.10000000149011612

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher.providers.session]
    prefix = ""

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screen_corners]
    size = 1

    [shell.screenshot]
    confirm_region = true
    copy_to_clipboard = true
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl hibernate"
    countdown_seconds = 3.0
    enabled = true
    label = "Hibernate"
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "6"
    variant = "destructive"

    [shell.shadow]
    alpha = 0.0

[system.monitor]
gpu_poll_seconds = 2

[theme]
builtin = "Noctalia"
community_palette = "Miasma"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "foot", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "kitty", "qt" ]
    community_ids = [ "antigravity", "neovim", "fastfetch", "bat" ]

[wallpaper]
directory = "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/wallpapers"
directory_dark = "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/wallpapers"

    [wallpaper.default]
    path = "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/wallpapers/gruvbox/gruvbox05.png"

    [wallpaper.last]
    path = "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/wallpapers/gruvbox/gruvbox05.png"

    [wallpaper.monitors.eDP-1]
    path = "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/wallpapers/gruvbox/gruvbox05.png"

[widget.clock]
color = "secondary"
format = "{:%H:%M %m/%d/%y}"

[widget.launcher]
color = "secondary"
enabled = false

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
enabled = false
type = "spacer"

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.temp]
show_label = false

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
inactive_pill_size = 1.0
label_source = "id"
pill_scale = 0.80000000000000004
show_labels = true
style = "minimal"
