# ==========================================
# HYPRLAND CONFIG - StardustArch (formato nativo .conf)
# Estrutura espelhada da organização CachyOS
# ==========================================

# --- IMPORTS DOS MÓDULOS ---
source = ~/.config/hypr/config/variables.conf
source = ~/.config/hypr/config/colors.conf
source = ~/.config/hypr/config/environment.conf
source = ~/.config/hypr/config/monitors.conf
source = ~/.config/hypr/config/inputs.conf
source = ~/.config/hypr/config/decorations.conf
source = ~/.config/hypr/config/animations.conf
source = ~/.config/hypr/config/misc.conf
source = ~/.config/hypr/config/windowrules.conf
source = ~/.config/hypr/config/autostart.conf
source = ~/.config/hypr/config/binds.conf
source = ~/.config/hypr/xdph.conf

# --- VARIÁVEIS DE AMBIENTE ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XDG_DATA_DIRS,$HOME/.nix-profile/share:/usr/local/share:/usr/share:$XDG_DATA_DIRS
