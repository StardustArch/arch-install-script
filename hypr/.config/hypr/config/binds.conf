# ==========================================
# KEYBINDINGS (StardustArch - sintaxe nativa .conf)
# ==========================================

# --- WINDOW MANAGEMENT ---
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, dolphin
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen,

# --- LAUNCHER ---
bind = $mainMod, Return, exec, [tile] $terminal
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, W, exec, ~/.nix-profile/bin/wall-manager select
bind = $mainMod SHIFT, W, exec, ~/.nix-profile/bin/wall-manager static
bind = $mainMod, T, exec, ~/.nix-profile/bin/wall-manager switch
bind = $mainMod, L, exec, hyprlock

# --- SCREENSHOTS (Nix Tools) ---
bind = , Print, exec, ~/.nix-profile/bin/grim -g "$(~/.nix-profile/bin/slurp)" - | ~/.nix-profile/bin/wl-copy
bind = SHIFT, Print, exec, ~/.nix-profile/bin/grim -g "$(~/.nix-profile/bin/slurp)" - | ~/.nix-profile/bin/swappy -f -

# --- CLIPBOARD (Com Rofi) ---
bind = $mainMod, V, exec, ~/.nix-profile/bin/cliphist list | rofi -dmenu -p "Clipboard" | ~/.nix-profile/bin/cliphist decode | ~/.nix-profile/bin/wl-copy

# --- INTERNET / BLUETOOTH ---
bind = $mainMod, N, exec, kitty --title "Network Manager" -e nmtui
bind = $mainMod, B, exec, kitty --title "Bluetooth Manager" -e bluetuith

# --- GESTÃO DE JANELAS ---
bind = $mainMod, C, killactive,

# --- ÁUDIO (teclas multimídia) ---
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- WORKSPACES ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- SPECIAL WORKSPACE (Scratchpad) ---
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
