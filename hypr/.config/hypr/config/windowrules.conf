# Window rules
windowrule = float, ^(vesktop|discord)$
windowrule = float, ^(.*[Cc]alc.*)
windowrule = float, ^(org.kde.keditfiletype)$
windowrule = float, ^(org.kde.ark)$
windowrule = float, ^(org.kde.dolphin)$

# Opacity overrides
windowrule = opacity 1.0 override, ^(firefox|zen)$
windowrule = opacity 1.0 override, ^(kitty|ghostty|[Kk]onsole|Alacritty|gnome-terminal|xfce[0-9]?-terminal)$
windowrule = opacity 1.0 override, ^(mpv|org.kde.haruna|.*plex.*|org.kde.gwenview|.*vlc.*)$
