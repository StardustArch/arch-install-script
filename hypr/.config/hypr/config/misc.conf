# General + misc options
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
    allow_tearing = true

    col.active_border = $accent1 $accent3 45deg
    col.inactive_border = $bg3
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x101d31
    vrr = 2
}
