# Hyprland default apps (StardustArch - mantido do projeto original)
$mainMod = SUPER
$terminal = kitty
$file_manager = dolphin
$browser = firefox
$editor = kitty -e nvim
$calculator = qalculate-gtk
$menu = rofi -show drun -show-icons

